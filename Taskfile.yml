version: '3'

vars:
  APP_NAME: "uniTerm"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Release version injected into each platform binary via -ldflags
  # "-X main.Version=...". Empty for dev builds (main.Version stays "dev").
  VERSION: '{{.VERSION | default ""}}'
  # Target architecture, forwarded to per-platform build tasks
  # (e.g. `wails3 build ARCH=arm64` cross-compiles windows/arm64).
  ARCH: '{{.ARCH | default ""}}'
  # Extra Go build tags appended to the production build, e.g. gtk3 for the
  # legacy WebKit2GTK 4.1 Linux stack.
  EXTRA_TAGS: '{{.EXTRA_TAGS | default ""}}'
  # Staging directory for signed release assets (RELEASES.md).
  RELEASE_DIR: dist/release

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          VERSION: '{{.VERSION}}'
          ARCH: '{{.ARCH}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          VERSION: '{{.VERSION}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  # --- Signed fork releases (RELEASES.md) -----------------------------------
  # The private key never touches this machine: release:package writes
  # dist/release/checksums.txt, which is signed on the offline machine with
  # scripts/release/offline-sign.sh; release:publish verifies and uploads.

  release:package:
    summary: Builds the macOS update assets (arm64 + amd64) and checksums.txt into dist/release
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required, e.g. wails3 task release:package VERSION=1.9.6"
      - sh: go run ./scripts/release/sigtool fingerprint -pub @build/release-pubkey.txt
        msg: "build/release-pubkey.txt is missing or invalid; see RELEASES.md (a build without it never installs updates)"
    cmds:
      - rm -rf "{{.RELEASE_DIR}}" && mkdir -p "{{.RELEASE_DIR}}"
      - task: release:package:darwin-arch
        vars: { ARCH: arm64, VERSION: '{{.VERSION}}' }
      - task: release:package:darwin-arch
        vars: { ARCH: amd64, VERSION: '{{.VERSION}}' }
      - go run ./scripts/release/sigtool checksums "{{.RELEASE_DIR}}"
      - echo "Next - offline machine:" sh offline-sign.sh uniterm-release.key checksums.txt

  release:package:darwin-arch:
    internal: true
    cmds:
      - task: darwin:build
        vars: { ARCH: '{{.ARCH}}', VERSION: '{{.VERSION}}', OUTPUT: 'bin/release-{{.ARCH}}/uniTerm' }
      # Refuse to ship a binary whose updater would not trust the release key.
      - go run ./scripts/release/sigtool binkey -expect @build/release-pubkey.txt "bin/release-{{.ARCH}}/uniTerm"
      # Bare executable at the zip root: the updater extracts "uniterm" from it.
      - zip -q -j "{{.RELEASE_DIR}}/uniterm-darwin-{{.ARCH}}-v{{.VERSION}}.zip" "bin/release-{{.ARCH}}/uniTerm"

  release:verify:
    summary: Verifies checksums.txt.sig and every asset hash in dist/release
    cmds:
      - go run ./scripts/release/sigtool verify -pub @build/release-pubkey.txt "{{.RELEASE_DIR}}"

  release:publish:
    summary: Verifies dist/release and uploads it as a DRAFT release on r1ckcs/uniterm (publish it in the browser)
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required (same as release:package)"
      - sh: gh auth status
        msg: "gh is not logged in (gh auth login)"
    cmds:
      - task: release:verify
      - gh release create "v{{.VERSION}}" "{{.RELEASE_DIR}}"/uniterm-* "{{.RELEASE_DIR}}/checksums.txt" "{{.RELEASE_DIR}}/checksums.txt.sig" --repo r1ckcs/uniterm --draft --title "uniTerm v{{.VERSION}}" {{if .NOTES_FILE}}--notes-file "{{.NOTES_FILE}}"{{else}}--generate-notes{{end}}

  android:compile:check:
    summary: Cross-compiles all Go packages for android (no SDK needed; CGO off)
    cmds:
      - GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -tags android,debug $(go list ./... | grep -v '/build/android')

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
